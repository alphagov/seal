name: "Afternoon Seal Quotes"

on:
  workflow_dispatch: {}
  schedule:
    - cron:  '00 12 * * 1-5' # Runs at 12:00 UTC, Monday through Friday.

env:
  SEAL_ORGANISATION: alphagov
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  afternoon-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true

      - name: Afternoon Seal Quotes
        id: afternoon_seal_quotes
        run: |
          ./bin/seal_runner.rb afternoon_seal_quotes

      - if: ${{ failure() }}
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.GOVUK_SLACK_WEBHOOK_URL }}
          channel: govuk-platform-support
          message: "Afternoon Seal Quotes workflow failed"
