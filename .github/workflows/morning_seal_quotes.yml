name: "Morning Seal Quotes"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 8 * * 1-5' # Runs at 8:30 AM, Monday through Friday.
      timezone: "Europe/London"

env:
  SEAL_ORGANISATION: alphagov
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  morning-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Morning Seal Quotes
        id: morning_seal_quotes
        run: |
          ./bin/seal_runner.rb morning_seal_quotes

      - if: ${{ failure() }}
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.GOVUK_SLACK_WEBHOOK_URL }}
          channel: govuk-platform-support
          message: "Morning Seal Quotes workflow failed"
