name: "GOV.UK Pay PRs"

on:
  workflow_dispatch: {}
  schedule:
    - cron:  '30 7 * * 1-5' # Runs at 7:30 UTC, Monday through Friday.

env:
  SEAL_ORGANISATION: govuk-pay
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

jobs:
  morning-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Seal PRs
        id: seal_prs
        run: ./bin/seal_runner.rb seal_prs

      - if: ${{ failure() }}
        uses: alphagov/govuk-infrastructure/.github/actions/report-run-failure@main
        with:
          slack_webhook_url: ${{ secrets.GOVUK_SLACK_WEBHOOK_URL }}
          channel: govuk-platform-support
          message: "Seal PRs workflow failed"
